<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rede de Conexões do Sul de Minas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#082744;--blue:#0f5d8c;--cyan:#21c4d8;--bg:#edf3f8;--card:#fff;--text:#172b3d;--muted:#6d7f90;--green:#13a675}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--text)}header{padding:25px 4%;color:white;background:linear-gradient(120deg,#071f37,#0d4871 70%,#13889a)}header h1{margin:0 0 6px;font-size:clamp(25px,4vw,42px)}header p{margin:0;opacity:.88}.wrap{max-width:1500px;margin:auto;padding:20px 3%}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:white;border:1px solid #dce7ef;border-radius:16px;box-shadow:0 8px 25px #123b5c12}.kpi{padding:17px}.kpi b{font-size:30px;color:var(--blue);display:block}.kpi span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}.layout{display:grid;grid-template-columns:390px 1fr;gap:18px;margin-top:18px}.panel{padding:18px}.panel h2{margin:0 0 14px;font-size:18px}.steps{display:flex;gap:5px;margin-bottom:15px}.step{height:5px;flex:1;border-radius:5px;background:#dbe6ee}.step.on{background:var(--cyan)}.page{display:none}.page.on{display:block}.field{margin-bottom:12px}label{display:block;font-size:12px;font-weight:700;color:#465e73;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd9e4;border-radius:9px;font:inherit;background:#fff}textarea{min-height:78px;resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip input{display:none}.chip span{display:block;padding:8px 10px;border:1px solid #c7d7e2;border-radius:18px;font-size:12px;cursor:pointer}.chip input:checked+span{background:#daf7fa;border-color:var(--cyan);color:#075671;font-weight:700}.actions{display:flex;gap:8px;margin-top:12px}button{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(90deg,var(--blue),#16899b);color:white;flex:1}.secondary{background:#e9f0f5;color:#29485e}.status{font-size:12px;margin-top:9px;min-height:16px}.ok{color:#087b55}.err{color:#b42318}.mapbox{padding:10px;position:relative}#map{height:600px;border-radius:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:8px}.toolbar select{width:auto;min-width:180px}.below{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.list{padding:18px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px;border-bottom:1px solid #edf1f4;font-size:13px}.badge{padding:4px 8px;background:#e4f7f8;color:#096074;border-radius:12px;font-size:11px}.empty{font-size:13px;color:var(--muted)}footer{text-align:center;padding:20px;color:var(--muted);font-size:12px}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.layout,.below{grid-template-columns:1fr}#map{height:470px}}
</style></head><body>
<header><h1>Rede de Conexões do Sul de Minas</h1><p>Um retrato vivo da participação, diversidade e integração territorial do evento.</p></header>
<div class="wrap">
<section class="kpis"><div class="card kpi"><b id="kTotal">0</b><span>Participantes</span></div><div class="card kpi"><b id="kCidades">0</b><span>Municípios</span></div><div class="card kpi"><b id="kInst">0</b><span>Instituições</span></div><div class="card kpi"><b id="kTemas">0</b><span>Temas conectados</span></div></section>
<section class="layout">
<aside class="card panel"><h2>Construa sua conexão</h2><div class="steps"><i class="step on"></i><i class="step"></i><i class="step"></i></div>
<form id="form">
<div class="page on">
<div class="field"><label>Nome</label><input id="nome" required maxlength="120"></div>
<div class="field"><label>Instituição</label><input id="instituicao" required maxlength="160"></div>
<div class="field"><label>Tipo de instituição</label><select id="tipo" required><option value="">Selecione</option><option>Escola pública</option><option>Escola privada</option><option>Secretaria de Educação</option><option>Universidade</option><option>Organização social</option><option>Empresa</option><option>Poder público</option><option>Outro</option></select></div>
<div class="actions"><button type="button" class="primary next">Continuar</button></div></div>
<div class="page">
<div class="field"><label>Município</label><select id="cidade" required><option value="">Selecione sua cidade</option></select></div>
<div class="field"><label>Perfil de participação</label><select id="perfil" required><option value="">Selecione</option><option>Gestão escolar</option><option>Supervisão pedagógica</option><option>Docência</option><option>Estudante</option><option>Gestão pública</option><option>Pesquisa</option><option>Parceiro institucional</option><option>Outro</option></select></div>
<div class="field"><label>Como deseja se conectar?</label><select id="objetivo" required><option value="">Selecione</option><option>Trocar experiências</option><option>Construir parceria</option><option>Conhecer projetos</option><option>Compartilhar boas práticas</option><option>Fortalecer rede regional</option></select></div>
<div class="actions"><button type="button" class="secondary prev">Voltar</button><button type="button" class="primary next">Continuar</button></div></div>
<div class="page">
<div class="field"><label>Temas de interesse, escolha um ou mais</label><div class="chips" id="chips"></div></div>
<div class="field"><label>Mensagem para a rede, opcional</label><textarea id="mensagem" maxlength="300" placeholder="Compartilhe uma ideia, projeto ou convite..."></textarea></div>
<div class="actions"><button type="button" class="secondary prev">Voltar</button><button id="save" class="primary">Registrar conexão</button></div><div id="status" class="status"></div></div>
</form></aside>
<div class="card mapbox"><div class="toolbar"><select id="fCidade"><option value="">Todas as cidades</option></select><select id="fTema"><option value="">Todos os temas</option></select><button id="clear" class="secondary">Limpar filtros</button></div><div id="map"></div></div>
</section>
<section class="below"><div class="card list"><h2>Municípios em destaque</h2><div id="ranking"></div></div><div class="card list"><h2>Conexões recentes</h2><div id="recentes"></div></div></section>
</div><footer>Mapa institucional de conexões regionais</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const C={"Poços de Caldas":[-21.7878,-46.5614],"Pouso Alegre":[-22.2300,-45.9327],"Varginha":[-21.5514,-45.4303],"Alfenas":[-21.4256,-45.9477],"Passos":[-20.7189,-46.6090],"Lavras":[-21.2450,-44.9998],"Itajubá":[-22.4256,-45.4528],"Três Corações":[-21.6960,-45.2537],"São Lourenço":[-22.1166,-45.0544],"Extrema":[-22.8540,-46.3188],"Cambuquira":[-21.8530,-45.2896],"Machado":[-21.6745,-45.9192],"Andradas":[-22.0685,-46.5692],"Caldas":[-21.9183,-46.3883],"Campestre":[-21.7114,-46.2461],"Guaxupé":[-21.3050,-46.7127],"Muzambinho":[-21.3759,-46.5253],"São Sebastião do Paraíso":[-20.9167,-46.9914],"Boa Esperança":[-21.0902,-45.5658],"Elói Mendes":[-21.6088,-45.5691],"Três Pontas":[-21.3694,-45.5109],"Santa Rita do Sapucaí":[-22.2522,-45.7033],"Cachoeira de Minas":[-22.3519,-45.7802],"Ouro Fino":[-22.2778,-46.3696],"Camanducaia":[-22.7553,-46.1448],"Caxambu":[-21.9770,-44.9329],"Baependi":[-21.9570,-44.8894],"Paraisópolis":[-22.5542,-45.7803],"Nepomuceno":[-21.2324,-45.2359],"Campo Belo":[-20.8976,-45.2784],"São Gonçalo do Sapucaí":[-21.8920,-45.5951],"Monte Sião":[-22.4325,-46.5722],"Borda da Mata":[-22.2738,-46.1655],"Jacutinga":[-22.2867,-46.6168]};
const T=['Educação integral','Alfabetização','Tecnologia educacional','Inclusão e equidade','Gestão escolar','Formação docente','Avaliação da aprendizagem','Sustentabilidade','Cultura e território','Inovação pedagógica'];
const cfg=window.APP_CONFIG||{};const db=(cfg.SUPABASE_URL&&cfg.SUPABASE_KEY)?supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY):null;
const map=L.map('map').setView([-21.75,-45.75],8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);let layers=[];let all=[];
const cidade=document.getElementById('cidade');Object.keys(C).sort().forEach(x=>cidade.add(new Option(x,x)));T.forEach(x=>{document.getElementById('chips').insertAdjacentHTML('beforeend',`<label class="chip"><input type="checkbox" value="${x}"><span>${x}</span></label>`);document.getElementById('fTema').add(new Option(x,x))});
let p=0;const pages=[...document.querySelectorAll('.page')],steps=[...document.querySelectorAll('.step')];function show(n){p=n;pages.forEach((x,i)=>x.classList.toggle('on',i===p));steps.forEach((x,i)=>x.classList.toggle('on',i<=p))}document.querySelectorAll('.next').forEach(b=>b.onclick=()=>{const inputs=[...pages[p].querySelectorAll('[required]')];if(inputs.every(x=>x.reportValidity()))show(p+1)});document.querySelectorAll('.prev').forEach(b=>b.onclick=()=>show(p-1));
function filt(){const c=document.getElementById('fCidade').value,t=document.getElementById('fTema').value;return all.filter(x=>(!c||x.cidade===c)&&(!t||(x.temas||[]).includes(t)))}
function render(){const d=filt();layers.forEach(x=>map.removeLayer(x));layers=[];const counts={};d.forEach(x=>counts[x.cidade]=(counts[x.cidade]||0)+1);Object.entries(counts).forEach(([c,n])=>{if(!C[c])return;const m=L.circleMarker(C[c],{radius:7+Math.min(n,14),color:'#075078',weight:2,fillColor:'#21c4d8',fillOpacity:.82}).addTo(map).bindPopup(`<b>${c}</b><br>${n} conexão(ões)`);layers.push(m);if(c!=='Poços de Caldas'){const l=L.polyline([C['Poços de Caldas'],C[c]],{color:'#19a8bc',weight:1.5,opacity:.45,dashArray:'6 9'}).addTo(map);layers.push(l)}});document.getElementById('kTotal').textContent=d.length;document.getElementById('kCidades').textContent=Object.keys(counts).length;document.getElementById('kInst').textContent=new Set(d.map(x=>x.instituicao).filter(Boolean)).size;document.getElementById('kTemas').textContent=new Set(d.flatMap(x=>x.temas||[])).size;document.getElementById('ranking').innerHTML=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([c,n],i)=>`<div class="row"><span>${i+1}. ${c}</span><b>${n}</b></div>`).join('')||'<div class="empty">Nenhum registro.</div>';document.getElementById('recentes').innerHTML=d.slice(0,7).map(x=>`<div class="row"><span><b>${x.nome}</b><br>${x.cidade} · ${x.instituicao}</span><span class="badge">${x.perfil||'Participante'}</span></div>`).join('')||'<div class="empty">Nenhuma conexão registrada.</div>'}
async function load(){if(!db)return;const {data,error}=await db.from('participantes').select('*').order('created_at',{ascending:false});if(error){status.textContent=error.message;status.className='status err';return}all=data||[];const fc=document.getElementById('fCidade');[...new Set(all.map(x=>x.cidade))].sort().forEach(x=>fc.add(new Option(x,x)));render()}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const temas=[...document.querySelectorAll('#chips input:checked')].map(x=>x.value);if(!temas.length){status.textContent='Escolha ao menos um tema.';status.className='status err';return}const item={nome:nome.value.trim(),instituicao:instituicao.value.trim(),cidade:cidade.value,tipo_instituicao:tipo.value,perfil:perfil.value,objetivo:objetivo.value,temas,mensagem:mensagem.value.trim(),latitude:C[cidade.value][0],longitude:C[cidade.value][1]};save.disabled=true;const {error}=await db.from('participantes').insert(item);save.disabled=false;if(error){status.textContent='Erro: '+error.message;status.className='status err';return}status.textContent='Conexão registrada com sucesso!';status.className='status ok';e.target.reset();show(0);load()};
['fCidade','fTema'].forEach(id=>document.getElementById(id).onchange=render);document.getElementById('clear').onclick=()=>{fCidade.value='';fTema.value='';render()};load();
</script></body></html>
